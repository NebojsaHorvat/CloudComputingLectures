<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 950" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#c9d3dd" stroke-width="3"/>
    </pattern>
    <!-- 1U server: 4 ležišta za diskove -->
    <g id="s1u">
      <rect x="0" y="1" width="224" height="17" rx="2" fill="#6b7a8a" stroke="#3d4650"/>
      <rect x="8" y="5" width="14" height="9" fill="#dfe6ee"/>
      <rect x="26" y="5" width="14" height="9" fill="#dfe6ee"/>
      <rect x="44" y="5" width="14" height="9" fill="#dfe6ee"/>
      <rect x="62" y="5" width="14" height="9" fill="#dfe6ee"/>
      <circle cx="212" cy="9.5" r="3" fill="#7CFC00"/>
    </g>
    <!-- 2U server: 12 ležišta (3 reda po 4) -->
    <g id="s2u">
      <rect x="0" y="1" width="224" height="36" rx="2" fill="#4f5d6b" stroke="#2d353e"/>
      <g fill="#dfe6ee">
        <rect x="8" y="5" width="18" height="8"/><rect x="30" y="5" width="18" height="8"/><rect x="52" y="5" width="18" height="8"/><rect x="74" y="5" width="18" height="8"/>
        <rect x="8" y="15" width="18" height="8"/><rect x="30" y="15" width="18" height="8"/><rect x="52" y="15" width="18" height="8"/><rect x="74" y="15" width="18" height="8"/>
        <rect x="8" y="25" width="18" height="8"/><rect x="30" y="25" width="18" height="8"/><rect x="52" y="25" width="18" height="8"/><rect x="74" y="25" width="18" height="8"/>
      </g>
      <circle cx="212" cy="19" r="3" fill="#7CFC00"/>
    </g>
    <!-- fioka za disk u disk polici -->
    <g id="tray"><rect width="31" height="13" fill="#fff3dd" stroke="#a86d14" stroke-width="0.8"/><rect x="24" y="4" width="4" height="5" fill="#a86d14"/></g>
  </defs>

  <rect x="2" y="2" width="636" height="946" rx="16" fill="#fff" fill-opacity="0.88" stroke="#c9d3dd" stroke-width="2"/>

  <!-- Kota: širina panela opreme -->
  <line x1="110" y1="48" x2="370" y2="48" stroke="#333" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="240" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">19 in = 482.6 mm (panel)</text>

  <!-- Kota: visina montažnog prostora -->
  <line x1="30" y1="70" x2="30" y2="868" stroke="#333" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text transform="translate(22,470) rotate(-90)" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">42U = 1867 mm</text>

  <!-- Šine reka -->
  <rect x="110" y="62" width="18" height="814" fill="#9aa5b1" stroke="#5f6b77"/>
  <rect x="352" y="62" width="18" height="814" fill="#9aa5b1" stroke="#5f6b77"/>
  <rect x="104" y="58" width="272" height="8" fill="#5f6b77"/>
  <rect x="104" y="868" width="272" height="10" fill="#5f6b77"/>
  <text x="119" y="84" text-anchor="middle" font-size="11" fill="#fff">42</text>
  <text x="119" y="864" text-anchor="middle" font-size="11" fill="#fff">1</text>

  <!-- Kota: otvor između šina -->
  <line x1="128" y1="902" x2="352" y2="902" stroke="#333" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="240" y="930" text-anchor="middle" font-size="18" fill="#333">otvor između šina: 450 mm</text>

  <!-- U42: patch panel, 24 porta -->
  <rect x="128" y="71" width="224" height="17" rx="2" fill="#8aa1b8" stroke="#56677a"/>
  <g fill="#2d353e">
    <rect x="134" y="76" width="6" height="7"/><rect x="143" y="76" width="6" height="7"/><rect x="152" y="76" width="6" height="7"/><rect x="161" y="76" width="6" height="7"/><rect x="170" y="76" width="6" height="7"/><rect x="179" y="76" width="6" height="7"/>
    <rect x="188" y="76" width="6" height="7"/><rect x="197" y="76" width="6" height="7"/><rect x="206" y="76" width="6" height="7"/><rect x="215" y="76" width="6" height="7"/><rect x="224" y="76" width="6" height="7"/><rect x="233" y="76" width="6" height="7"/>
    <rect x="242" y="76" width="6" height="7"/><rect x="251" y="76" width="6" height="7"/><rect x="260" y="76" width="6" height="7"/><rect x="269" y="76" width="6" height="7"/><rect x="278" y="76" width="6" height="7"/><rect x="287" y="76" width="6" height="7"/>
    <rect x="296" y="76" width="6" height="7"/><rect x="305" y="76" width="6" height="7"/><rect x="314" y="76" width="6" height="7"/><rect x="323" y="76" width="6" height="7"/><rect x="332" y="76" width="6" height="7"/><rect x="341" y="76" width="6" height="7"/>
  </g>

  <!-- U41–40: ToR svičevi -->
  <rect x="128" y="90" width="224" height="17" rx="2" fill="#3b6ea5" stroke="#244a73"/>
  <rect x="128" y="109" width="224" height="17" rx="2" fill="#3b6ea5" stroke="#244a73"/>
  <g fill="#cfe0f3"><rect x="140" y="95" width="150" height="7"/><rect x="140" y="114" width="150" height="7"/></g>

  <!-- U39–30: slobodno (blanking paneli) -->
  <rect x="128" y="128" width="224" height="188" fill="url(#hatch)" stroke="#c9d3dd" stroke-dasharray="4 3"/>

  <!-- U29–20: 10× 1U server -->
  <use href="#s1u" x="128" y="317"/><use href="#s1u" x="128" y="336"/><use href="#s1u" x="128" y="355"/><use href="#s1u" x="128" y="374"/><use href="#s1u" x="128" y="393"/>
  <use href="#s1u" x="128" y="412"/><use href="#s1u" x="128" y="431"/><use href="#s1u" x="128" y="450"/><use href="#s1u" x="128" y="469"/><use href="#s1u" x="128" y="488"/>

  <!-- U19–12: 4× 2U server -->
  <use href="#s2u" x="128" y="507"/><use href="#s2u" x="128" y="545"/><use href="#s2u" x="128" y="583"/><use href="#s2u" x="128" y="621"/>

  <!-- U11–8: GPU server 4U -->
  <rect x="128" y="660" width="224" height="74" rx="3" fill="#7a4fa0" stroke="#4e2f6a"/>
  <g fill="#e6d9f2"><rect x="140" y="672" width="200" height="8"/><rect x="140" y="686" width="200" height="8"/><rect x="140" y="700" width="200" height="8"/><rect x="140" y="714" width="200" height="8"/></g>

  <!-- U7–4: disk polica 4U, 24 diska -->
  <rect x="128" y="736" width="224" height="74" rx="3" fill="#e8a033" stroke="#a86d14"/>
  <use href="#tray" x="136" y="742"/><use href="#tray" x="170" y="742"/><use href="#tray" x="204" y="742"/><use href="#tray" x="238" y="742"/><use href="#tray" x="272" y="742"/><use href="#tray" x="306" y="742"/>
  <use href="#tray" x="136" y="758"/><use href="#tray" x="170" y="758"/><use href="#tray" x="204" y="758"/><use href="#tray" x="238" y="758"/><use href="#tray" x="272" y="758"/><use href="#tray" x="306" y="758"/>
  <use href="#tray" x="136" y="774"/><use href="#tray" x="170" y="774"/><use href="#tray" x="204" y="774"/><use href="#tray" x="238" y="774"/><use href="#tray" x="272" y="774"/><use href="#tray" x="306" y="774"/>
  <use href="#tray" x="136" y="790"/><use href="#tray" x="170" y="790"/><use href="#tray" x="204" y="790"/><use href="#tray" x="238" y="790"/><use href="#tray" x="272" y="790"/><use href="#tray" x="306" y="790"/>

  <!-- U3–1: UPS -->
  <rect x="128" y="812" width="224" height="55" rx="3" fill="#333" stroke="#111"/>
  <rect x="140" y="824" width="40" height="18" fill="#7CFC00" fill-opacity="0.7"/>
  <g fill="#666"><rect x="200" y="822" width="140" height="5"/><rect x="200" y="832" width="140" height="5"/><rect x="200" y="842" width="140" height="5"/><rect x="200" y="852" width="140" height="5"/></g>

  <!-- Kota 1U -->
  <line x1="98" y1="317" x2="98" y2="336" stroke="#333" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="92" y="318" text-anchor="end" font-size="16" font-weight="bold" fill="#333">1U =</text>
  <text x="92" y="338" text-anchor="end" font-size="16" fill="#333">44.45</text>
  <text x="92" y="356" text-anchor="end" font-size="16" fill="#333">mm</text>

  <!-- Oznake desno -->
  <g font-size="22" fill="#333">
    <line x1="374" y1="79" x2="392" y2="79" stroke="#333"/><text x="398" y="86">Patch panel (1U)</text>
    <path d="M380,91 h8 v34 h-8" fill="none" stroke="#333"/><text x="398" y="116">2× ToR svič (1U)</text>
    <path d="M380,129 h8 v186 h-8" fill="none" stroke="#888"/><text x="398" y="215" fill="#888">slobodno (10U)</text>
    <text x="398" y="240" font-size="17" fill="#888">blanking paneli</text>
    <path d="M380,318 h8 v188 h-8" fill="none" stroke="#333"/><text x="398" y="419">10× server 1U</text>
    <path d="M380,508 h8 v150 h-8" fill="none" stroke="#333"/><text x="398" y="590">4× server 2U</text>
    <path d="M380,661 h8 v72 h-8" fill="none" stroke="#333"/><text x="398" y="704">GPU server (4U)</text>
    <path d="M380,737 h8 v72 h-8" fill="none" stroke="#333"/><text x="398" y="768">Disk polica (4U)</text>
    <text x="398" y="790" font-size="17" fill="#666">24 diska</text>
    <path d="M380,813 h8 v53 h-8" fill="none" stroke="#333"/><text x="398" y="840">UPS (3U)</text>
    <text x="398" y="862" font-size="17" fill="#666">teška oprema → dole</text>
  </g>
</svg>
